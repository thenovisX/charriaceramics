<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Panel · Charria Ceramics</title>
  <!-- Instalable como app desde Chrome (Android, ordenador) y Safari (iPhone: Compartir → Añadir a pantalla de inicio) -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#ece6dc">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Charria">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css?v=6">
</head>
<body>

  <!-- Login -->
  <main class="login" data-view-login hidden>
    <form class="login__box" data-login-form>
      <p class="eyebrow">Panel de administración</p>
      <h1 class="login__title">Charria <span>Ceramics</span></h1>
      <label class="field"><span>Email</span><input type="email" name="email" autocomplete="username" required></label>
      <label class="field"><span>Contraseña</span><input type="password" name="password" autocomplete="current-password" required></label>
      <button class="btn" type="submit">Entrar</button>
      <p class="form-error" data-login-error hidden></p>
      <a class="login__back" href="../index.html">← Volver a la web</a>
    </form>
  </main>

  <!-- Panel -->
  <div class="app" data-view-app hidden>
    <aside class="side">
      <a class="side__logo" href="../index.html" target="_blank" rel="noopener">Charria <span>Ceramics</span></a>
      <!-- Solo en móvil: muestra la sección actual y abre el menú -->
      <button class="side__toggle" type="button" aria-expanded="false" aria-controls="side-menu" data-menu-toggle>
        <span data-menu-current>Menú</span><span class="count" data-unread hidden></span><span class="side__toggle-icon" aria-hidden="true"></span>
      </button>
      <nav class="side__nav" id="side-menu" data-nav>
        <a href="#resumen">Resumen</a>
        <a href="#mensajes">Mensajes<span class="count" data-unread hidden></span></a>
        <a href="#pedidos">Pedidos</a>
        <a href="#productos">Productos</a>
        <a href="#clases">Clases y horarios</a>
        <a href="#reservas">Reservas</a>
        <a href="#galeria">Galería</a>
        <a href="#clientes">Clientes</a>
        <a href="#ajustes">Ajustes</a>
        <a href="#cuenta">Cuenta</a>
      </nav>
      <p class="side__user" data-user></p>
    </aside>
    <main class="main" data-main aria-live="polite"></main>
  </div>

  <!-- Panel lateral de edición -->
  <div class="drawer" data-drawer hidden>
    <div class="drawer__backdrop" data-drawer-close></div>
    <section class="drawer__box" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
      <header class="drawer__head">
        <h2 id="drawer-title" data-drawer-title></h2>
        <button class="icon-btn" type="button" data-drawer-close aria-label="Cerrar">×</button>
      </header>
      <div class="drawer__body" data-drawer-body></div>
    </section>
  </div>

  <div class="toast" data-toast role="status" hidden></div>

  <script src="admin.js?v=7"></script>
</body>
</html>
